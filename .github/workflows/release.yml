name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: "!startsWith(github.event.head_commit.message, 'chore: release')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - id: bump
        run: |
          MSG=$(git log -1 --pretty=%s)
          if echo "$MSG" | grep -qE '^[a-z]+(\([^)]+\))?!:'; then
            KIND=major
          elif echo "$MSG" | grep -qE '^feat(\([^)]+\))?:'; then
            KIND=minor
          elif echo "$MSG" | grep -qE '^fix(\([^)]+\))?:'; then
            KIND=patch
          else
            KIND=none
          fi
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          echo "Detected: $KIND"

      - if: steps.bump.outputs.kind != 'none'
        id: version
        run: |
          OLD=$(node -p "require('./package.json').version")
          IFS='.' read -r MA MI PA <<< "$OLD"
          case "${{ steps.bump.outputs.kind }}" in
            major) NEW="$((MA+1)).0.0" ;;
            minor) NEW="$MA.$((MI+1)).0" ;;
            patch) NEW="$MA.$MI.$((PA+1))" ;;
          esac
          echo "old=$OLD" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.version='$NEW';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          sed -i "s/| Version | v$OLD |/| Version | v$NEW |/" README.md

      - if: steps.bump.outputs.kind != 'none'
        id: notes
        run: |
          OLD="${{ steps.version.outputs.old }}"
          NEW="${{ steps.version.outputs.new }}"
          COMMITS=$(git log "v$OLD..HEAD" --pretty=format:"%s" | grep -vE '^chore: release v' || true)

          section() {
            local prefix="$1" title="$2" lines
            lines=$(printf '%s\n' "$COMMITS" | grep -E "^$prefix(\([^)]+\))?!?:" | sed -E "s/^$prefix(\([^)]+\))?!?:[[:space:]]*/- /" || true)
            if [ -n "$lines" ]; then
              printf '## %s\n\n%s\n\n' "$title" "$lines"
            fi
          }

          {
            printf 'Released from `main`. Live at https://preyan.github.io\n\n'
            section feat 'Features'
            section fix 'Fixes'
            section docs 'Documentation'
            section refactor 'Refactoring'
            section style 'Style'
            section ci 'CI / Tooling'
            section chore 'Maintenance'
            printf -- '---\n\n'
            printf '**Full changelog:** https://github.com/%s/compare/v%s...v%s\n\n' "$GITHUB_REPOSITORY" "$OLD" "$NEW"
            printf '**Stack:** Astro 6 · MDX · Tailwind 4 · TypeScript · GitHub Pages\n'
          } > /tmp/notes.md

          {
            echo 'body<<RELEASE_NOTES_END'
            cat /tmp/notes.md
            echo 'RELEASE_NOTES_END'
          } >> "$GITHUB_OUTPUT"

      - if: steps.bump.outputs.kind != 'none'
        run: |
          NEW="${{ steps.version.outputs.new }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json README.md
          git commit -m "chore: release v$NEW"
          git tag -a "v$NEW" -m "Release v$NEW"
          git push --follow-tags

      - if: steps.bump.outputs.kind != 'none'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.new }}
          name: v${{ steps.version.outputs.new }}
          body: ${{ steps.notes.outputs.body }}
