name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: "!startsWith(github.event.head_commit.message, 'chore: release')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - id: bump
        run: |
          MSG=$(git log -1 --pretty=%s)
          if echo "$MSG" | grep -qE '^[a-z]+(\([^)]+\))?!:'; then
            KIND=major
          elif echo "$MSG" | grep -qE '^feat(\([^)]+\))?:'; then
            KIND=minor
          elif echo "$MSG" | grep -qE '^fix(\([^)]+\))?:'; then
            KIND=patch
          else
            KIND=none
          fi
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          echo "Detected: $KIND"

      - if: steps.bump.outputs.kind != 'none'
        id: version
        run: |
          OLD=$(node -p "require('./package.json').version")
          IFS='.' read -r MA MI PA <<< "$OLD"
          case "${{ steps.bump.outputs.kind }}" in
            major) NEW="$((MA+1)).0.0" ;;
            minor) NEW="$MA.$((MI+1)).0" ;;
            patch) NEW="$MA.$MI.$((PA+1))" ;;
          esac
          echo "old=$OLD" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.version='$NEW';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          sed -i "s/| Version | v$OLD |/| Version | v$NEW |/" README.md

      - if: steps.bump.outputs.kind != 'none'
        run: |
          NEW="${{ steps.version.outputs.new }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json README.md
          git commit -m "chore: release v$NEW"
          git tag -a "v$NEW" -m "Release v$NEW"
          git push --follow-tags

      - if: steps.bump.outputs.kind != 'none'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.new }}
          name: v${{ steps.version.outputs.new }}
          body: |
            Released from `main`. Live at https://preyan.github.io

            **Full changelog:** https://github.com/${{ github.repository }}/compare/v${{ steps.version.outputs.old }}...v${{ steps.version.outputs.new }}
          generate_release_notes: true
