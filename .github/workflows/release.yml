name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine previous tag
        id: previous_tag
        run: |
          PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${GITHUB_REF#refs/tags/}$" | head -n 1)
          echo "tag=${PREVIOUS_TAG:-}" >> $GITHUB_OUTPUT
          echo "Previous tag detected: ${PREVIOUS_TAG:-none}"

      - name: Generate release notes
        id: notes
        run: |
          CURRENT_TAG="${GITHUB_REF#refs/tags/}"
          PREVIOUS_TAG="${{ steps.previous_tag.outputs.tag }}"

          if [ -z "$PREVIOUS_TAG" ]; then
            COMMIT_RANGE="HEAD"
            COMPARE_HEADER="Initial release"
          else
            COMMIT_RANGE="${PREVIOUS_TAG}..HEAD"
            COMPARE_HEADER="**Full changelog:** https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...${CURRENT_TAG}"
          fi

          FEATURES=$(git log $COMMIT_RANGE --pretty=format:"- %s" --grep="^feat" | sed 's/^- feat[(:]\?[^:]*: */- /' || true)
          FIXES=$(git log $COMMIT_RANGE --pretty=format:"- %s" --grep="^fix" | sed 's/^- fix[(:]\?[^:]*: */- /' || true)
          DOCS=$(git log $COMMIT_RANGE --pretty=format:"- %s" --grep="^docs" | sed 's/^- docs[(:]\?[^:]*: */- /' || true)
          CHORES=$(git log $COMMIT_RANGE --pretty=format:"- %s" --grep="^chore" | sed 's/^- chore[(:]\?[^:]*: */- /' || true)
          STYLE=$(git log $COMMIT_RANGE --pretty=format:"- %s" --grep="^style" | sed 's/^- style[(:]\?[^:]*: */- /' || true)
          REFACTOR=$(git log $COMMIT_RANGE --pretty=format:"- %s" --grep="^refactor" | sed 's/^- refactor[(:]\?[^:]*: */- /' || true)

          NOTES="Released from \`main\`. Live at https://preyan.github.io"
          NOTES="$NOTES

"
          NOTES="$NOTES$COMPARE_HEADER"
          NOTES="$NOTES

"

          if [ -n "$FEATURES" ]; then
            NOTES="$NOTES## Features

$FEATURES

"
          fi
          if [ -n "$FIXES" ]; then
            NOTES="$NOTES## Fixes

$FIXES

"
          fi
          if [ -n "$DOCS" ]; then
            NOTES="$NOTES## Documentation

$DOCS

"
          fi
          if [ -n "$CHORES" ]; then
            NOTES="$NOTES## Maintenance

$CHORES

"
          fi
          if [ -n "$STYLE" ]; then
            NOTES="$NOTES## Style

$STYLE

"
          fi
          if [ -n "$REFACTOR" ]; then
            NOTES="$NOTES## Refactoring

$REFACTOR

"
          fi

          NOTES="$NOTES---

**Stack:** Astro 5 · MDX · Tailwind 4 · TypeScript · GitHub Pages"

          {
            echo 'body<<RELEASE_NOTES_END'
            echo "$NOTES"
            echo 'RELEASE_NOTES_END'
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
